[ccp_selected_requirements]
definition = inputlookup requirements.csv | lookup ccp_framework_selections framework_key OUTPUT selected | lookup ccp_framework_catalog framework_key OUTPUT default_selected | eval selected_value=tostring(coalesce(selected,default_selected)), selected=if(selected_value="1" OR selected_value="true",1,0) | search selected=1
iseval = 0

[ccp_latest_assessments]
definition = inputlookup ccp_assessment_current | eval current_key=coalesce(current_key,"assessment-" . framework_key . "-" . requirement_key . "-" . scope_key . "-" . system_key), source_rank=0 | append [| inputlookup ccp_assessments | eval current_key="assessment-" . framework_key . "-" . requirement_key . "-" . scope_key . "-" . system_key, source_rank=1] | sort 0 source_rank - assessed_at | dedup current_key
iseval = 0

[ccp_evidence_rollup]
definition = inputlookup ccp_evidence_current | eval current_key=coalesce(current_key,"evidence-" . framework_key . "-" . requirement_key . "-" . scope_key . "-" . system_key . "-" . evidence_type . "-" . title), source_rank=0 | append [| inputlookup ccp_evidence | eval current_key="evidence-" . framework_key . "-" . requirement_key . "-" . scope_key . "-" . system_key . "-" . evidence_type . "-" . title, source_rank=1] | sort 0 source_rank - collected_at | dedup current_key | stats count as evidence_count latest(collected_at) as last_evidence latest(status) as evidence_status latest(expires_at) as expires_at latest(review_due_at) as review_due_at latest(reviewed_by) as reviewed_by latest(reviewed_at) as reviewed_at by framework_key requirement_key scope_key system_key
iseval = 0

[ccp_measurement_rollup]
definition = inputlookup ccp_measurements | eval measurement_origin="manual" | append [| inputlookup ccp_measurement_cache | eval result_key=cache_key, evidence_key="", measurement_origin="scheduled"] | sort 0 - measured_at | dedup scope_key framework_key requirement_key measurement_key
iseval = 0
