[ccp_systems]
collection = ccp_systems
external_type = kvstore
fields_list = _key,system_key,system_name,description,system_type,environment,owner,business_owner,technical_owner,criticality,data_classification,regulatory_impact,status,updated_at,scope_key

[ccp_assessments]
collection = ccp_assessments
external_type = kvstore
fields_list = _key,system_key,scope_key,framework_key,framework_version,content_digest,requirement_key,status,score,assessor,assessed_at,reviewer,reviewed_at,valid_until,exception_reference,notes

[ccp_assessment_current]
collection = ccp_assessment_current
external_type = kvstore
fields_list = _key,current_key,system_key,scope_key,framework_key,framework_version,content_digest,requirement_key,status,score,assessor,assessed_at,reviewer,reviewed_at,valid_until,exception_reference,notes

[ccp_evidence]
collection = ccp_evidence
external_type = kvstore
fields_list = _key,system_key,scope_key,framework_key,framework_version,content_digest,requirement_key,evidence_type,title,location,owner,collected_by,source_type,status,collected_at,review_due_at,expires_at,reviewed_by,reviewed_at,acceptance_notes,document_url,document_version,artifact_hash

[ccp_evidence_current]
collection = ccp_evidence_current
external_type = kvstore
fields_list = _key,current_key,system_key,scope_key,framework_key,framework_version,content_digest,requirement_key,evidence_type,title,location,owner,collected_by,source_type,status,collected_at,review_due_at,expires_at,reviewed_by,reviewed_at,acceptance_notes,document_url,document_version,artifact_hash

[ccp_framework_selections]
collection = ccp_framework_selections
external_type = kvstore
fields_list = _key,framework_key,selected,updated_by,updated_at

[ccp_mapping_reviews]
collection = ccp_mapping_reviews
external_type = kvstore
fields_list = _key,framework_key,framework_version,requirement_key,source_reference,mapping_type,mapping_status,mapping_review_status,reviewer,reviewed_at,approval_basis,approval_limitation,assessment_method_reference,applicability_notes,next_review_at

[ccp_scopes]
collection = ccp_scopes
external_type = kvstore
fields_list = _key,scope_key,scope_name,scope_type,owner,description,status,updated_at

[ccp_findings]
collection = ccp_findings
external_type = kvstore
fields_list = _key,finding_key,scope_key,framework_key,framework_version,requirement_key,title,severity,status,owner,owner_kind,owner_role,due_at,remediation,source,exception_reference,retest_at,closed_at,notes,updated_at

[ccp_measurements]
collection = ccp_measurements
external_type = kvstore
fields_list = _key,result_key,scope_key,framework_key,framework_version,requirement_key,measurement_key,adapter_key,status,observed_value,expected_value,measured_at,source,evidence_key,limitations,updated_at

[ccp_measurement_cache]
collection = ccp_measurement_cache
external_type = kvstore
fields_list = _key,cache_key,check_key,scope_key,framework_key,framework_version,requirement_key,measurement_key,adapter_key,status,observed_value,expected_value,measured_at,source,limitations,details,updated_at

[ccp_integration_catalog]
filename = integration_catalog.csv
case_sensitive_match = false

[ccp_integration_health]
collection = ccp_integration_health
external_type = kvstore
fields_list = _key,health_key,integration_key,capability,status,observed_value,checked_at,source,limitations,updated_at
