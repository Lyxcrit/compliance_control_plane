[CCP - Refresh technical measurement cache]
displayview = flashtimeline
description = Refreshes the opt-in normalized cache for built-in Splunk technical checks. Review scope, permissions, and schedule before enabling.
search = | rest /services/data/indexes splunk_server=local | search disabled=0 NOT title="_*" | eval retention_days=round(frozenTimePeriodInSecs/86400,1), target_days=180 | stats count as total_indexes count(eval(retention_days>=target_days)) as meeting_target min(retention_days) as minimum_retention | eval check_key="splunk.index_retention", requirement_key="m26-14.data-retention", measurement_key="index_retention_configuration", adapter_key="splunk.index_retention", framework_key="omb-m-26-14", framework_version="2026-05-22", scope_key="global", status=case(total_indexes=0,"Not assessed",meeting_target=total_indexes,"Pass",meeting_target>0,"Partial",1=1,"Fail"), observed_value=meeting_target." of ".total_indexes." active indexes meet the 180-day retrieval target", expected_value="All active non-internal indexes meet 180 days", details="Minimum configured retention: ".coalesce(minimum_retention,"not measured")." days", source="Scheduled technical check: Index retention configuration" | append [| tstats summariesonly=false count where index=* earliest=-24h latest=now by index | stats dc(index) as indexes_with_events sum(count) as events | eval check_key="splunk.recent_index_activity", requirement_key="m26-14.collection-coverage", measurement_key="recent_index_activity", adapter_key="splunk.recent_index_activity", framework_key="omb-m-26-14", framework_version="2026-05-22", scope_key="global", status=case(indexes_with_events>0,"Pass",1=1,"Not assessed"), observed_value=indexes_with_events." indexes received ".events." events in the last 24 hours", expected_value="At least one in-scope index has recent activity", details="24-hour activity signal only", source="Scheduled technical check: Recent indexed activity"] | append [| metadata type=hosts index=* | stats dc(host) as hosts | eval check_key="splunk.host_metadata", requirement_key="m26-14.inventory-visibility", measurement_key="cim_endpoint_inventory", adapter_key="splunk.host_metadata", framework_key="omb-m-26-14", framework_version="2026-05-22", scope_key="global", status=case(hosts>0,"Pass",1=1,"Not assessed"), observed_value=hosts." hosts observed in Splunk metadata", expected_value="At least one host is observed", details="Host metadata is an observed inventory signal", source="Scheduled technical check: Splunk host metadata inventory"] | append [| search index=ea_discovery earliest=-24h latest=now | stats count as events dc(ip_key) as ip_assets dc(nt_host) as host_assets dc(mac) as mac_assets dc(user_key) as user_assets | eval check_key="splunk.exposure_analytics", requirement_key="m26-14.inventory-visibility", measurement_key="exposure_analytics_inventory", adapter_key="splunk.exposure_analytics", framework_key="omb-m-26-14", framework_version="2026-05-22", scope_key="global", status=case(events>0,"Pass",1=1,"Not assessed"), observed_value=events." recent discovery events; hosts=".host_assets.", ip=".ip_assets.", mac=".mac_assets.", users=".user_assets, expected_value="Exposure Analytics produces recent discovery data", details="24-hour discovery signal", source="Scheduled technical check: Exposure Analytics inventory"] | append [| search index=ea_discovery earliest=-24h latest=now | stats count as events latest(_time) as latest_event | eval age_minutes=round((now()-latest_event)/60,1), check_key="splunk.exposure_analytics_freshness", requirement_key="m26-14.collection-coverage", measurement_key="exposure_analytics_inventory", adapter_key="splunk.exposure_analytics_freshness", framework_key="omb-m-26-14", framework_version="2026-05-22", scope_key="global", status=case(events=0,"Not assessed",age_minutes<=1440,"Pass",1=1,"Fail"), observed_value=events." events; latest event ".age_minutes." minutes ago", expected_value="Discovery data is no more than 24 hours old", details="Freshness is measured against the latest event", source="Scheduled technical check: Exposure Analytics source freshness"] | eval cache_key="cache-".check_key, measured_at=strftime(now(),"%Y-%m-%dT%H:%M:%SZ"), limitations="Cached scheduled result; verify scope and source limitations before assessment", updated_at=measured_at, _key=cache_key | table _key cache_key check_key scope_key framework_key framework_version requirement_key measurement_key adapter_key status observed_value expected_value measured_at source limitations details updated_at | outputlookup ccp_measurement_cache
cron_schedule = */15 * * * *
enableSched = 0
dispatch.earliest_time = -15m
dispatch.latest_time = now
alert.track = 0

[CCP - Refresh optional integration health]
displayview = flashtimeline
description = Checks optional CIM, Enterprise Security, and Exposure Analytics capabilities without treating missing products as compliance failures. Review and enable only after confirming permissions.
search = | makeresults | eval integration_key="splunk.cim", capability="Normalized data-model coverage", status="Not assessed", observed_value="CIM health requires a data-model-specific check", source="datamodel Endpoint", limitations="Data-model absence or empty data is not a compliance failure; configure CIM and validate field quality before relying on the signal" | append [| makeresults | eval integration_key="splunk.es", capability="Asset and identity context", status="Not assessed", observed_value="Enterprise Security health requires an administrator-owned REST check", source="REST /services/apps/local/SplunkEnterpriseSecuritySuite", limitations="App availability does not prove asset or identity data quality; the default scheduler does not make privileged REST calls"] | append [| search index=ea_discovery earliest=-24h latest=now | stats count as events | eval integration_key="splunk.exposure_analytics", capability="Exposure inventory", status=if(events>0,"Available","Not configured"), observed_value=events." discovery events in the last 24 hours", source="index=ea_discovery", limitations="Discovery data does not prove complete system-boundary coverage"] | eval health_key="health-".integration_key, checked_at=strftime(now(),"%Y-%m-%dT%H:%M:%SZ"), updated_at=checked_at, _key=health_key | table _key health_key integration_key capability status observed_value checked_at source limitations updated_at | outputlookup ccp_integration_health
cron_schedule = */30 * * * *
enableSched = 0
dispatch.earliest_time = -30m
dispatch.latest_time = now
alert.track = 0
